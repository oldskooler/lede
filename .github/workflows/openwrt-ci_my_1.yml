# ============================================================
#  OpenWrt CI  ——  x86_64 固件自动编译
#  基于 KFERMercer/OpenWrt-CI 改造
#
# ============================================================

name: OpenWrt-CI_My_1

on:
  workflow_dispatch:
    inputs:
      release:
        description: '编译完成后发布为 Release'
        type: boolean
        default: false
  schedule:
    - cron: 30 20 * * 5      # UTC，即北京时间周六 04:30
  release:
    types: [published]

# 若要用「发布 Release」功能，把 read 改成 write

permissions:
  contents: write

env:
  CLANG_VER: 15
  CONFIG_FILE: makeconfig.d/x86_64.config

jobs:
  build_openwrt:
    name: Build OpenWrt Firmware
    runs-on: ubuntu-22.04

    steps:
      # -------------------------------------------------------
      - name: Space cleanup and Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker image prune -f
          sudo -E rm -rf /usr/share/dotnet /etc/mysql /etc/php \
                         /usr/local/lib/android
          sudo -E apt-mark hold grub-efi-amd64-signed
          sudo -E apt update
          sudo -E apt -y purge azure-cli* docker* ghc* zulu* firefox \
                             google* dotnet* powershell* openjdk* mysql* \
                             php* mongodb* snap*
          sudo -E apt -y full-upgrade
          sudo -E apt -y install ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache cmake cpio curl \
            device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
            genisoimage git gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev \
            libpython3-dev libreadline-dev libssl-dev libtool lrzsz msmtp \
            ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pyelftools python3-setuptools qemu-utils rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
            vim wget xmlto xxd zlib1g-dev
          sudo -E systemctl daemon-reload
          sudo -E apt -y autoremove          # 去掉 --purge，防误伤
          sudo -E apt clean
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      # -------------------------------------------------------
      - name: Checkout OpenWrt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------------
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false        # true 会删 hostedtoolcache，可能波及工具链
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false      # swap 由下面独立步骤配置

      # -------------------------------------------------------
      - name: Setup swap
        run: |
          sudo fallocate -l 8G /swapfile_ci || sudo dd if=/dev/zero of=/swapfile_ci bs=1M count=8192 status=progress
          sudo chmod 600 /swapfile_ci
          sudo mkswap /swapfile_ci
          sudo swapon /swapfile_ci
          free -h

      # -------------------------------------------------------
      # 关键修复：naiveproxy 虽已在 .config 关闭，仍保留 clang 作为保险
      # （万一日后勾回 NaiveProxy / 加入其他需要 clang 的包）
      - name: 'Ensure clang toolchain (fix: clang++ not found)'
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get -y install --no-install-recommends \
            clang-${CLANG_VER} lld-${CLANG_VER} llvm-${CLANG_VER}-dev libclang-${CLANG_VER}-dev

          sudo update-alternatives --install /usr/bin/clang clang \
               /usr/bin/clang-${CLANG_VER} 100 \
               --slave /usr/bin/clang++ clang++ /usr/bin/clang++-${CLANG_VER} \
               --slave /usr/bin/ld.lld    ld.lld  /usr/bin/lld-${CLANG_VER} \
               --slave /usr/bin/llvm-ar   llvm-ar /usr/bin/llvm-ar-${CLANG_VER}
          sudo update-alternatives --auto clang

          echo "===== clang sanity check ====="
          which clang clang++ ld.lld
          clang++ --version
          # 真实编译测试：确认 -std=c++23 可用（gn 需要）
          echo 'int main(){return 0;}' > /tmp/t.cc
          clang++ -std=c++23 /tmp/t.cc -o /tmp/t && echo ">> C++23 OK"
          ld.lld --version || true

      # -------------------------------------------------------
      # 若将来需要 clang-17，改用下面这段（jammy 源没有 17，必须加官方源）：
      #   wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
      #   chmod +x /tmp/llvm.sh
      #   sudo /tmp/llvm.sh 17
      #   sudo apt-get -y install clang-17 lld-17 llvm-17-dev libclang-17-dev
      #   sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-17 100 \
      #     --slave /usr/bin/clang++ clang++ /usr/bin/clang++-17 \
      #     --slave /usr/bin/ld.lld ld.lld /usr/bin/lld-17
      # -------------------------------------------------------

      # -------------------------------------------------------
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('makeconfig.d/*.config') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ hashFiles('makeconfig.d/*.config') }}-
            ccache-${{ runner.os }}-

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ hashFiles('makeconfig.d/*.config') }}-${{ github.sha }}
          restore-keys: |
            dl-${{ hashFiles('makeconfig.d/*.config') }}-
            dl-

      # -------------------------------------------------------
      - name: Update feeds
        run: |
          # 先删掉任何已存在的 helloworld 行，再统一追加，避免重复源
          sed -i '/helloworld/d' ./feeds.conf.default
          echo 'src-git helloworld https://github.com/fw876/helloworld.git' >> ./feeds.conf.default
          echo "===== feeds.conf.default ====="
          cat ./feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # -------------------------------------------------------
      - name: Generate configuration file
        run: |
          set -e
          if [ ! -f "${CONFIG_FILE}" ]; then
            echo "FATAL: ${CONFIG_FILE} 不存在，请检查仓库路径"
            ls -R makeconfig.d || true
            exit 1
          fi
          cp ./${CONFIG_FILE} ./.config

          # ---- 保险丝 1：彻底掐掉 NaiveProxy（gn/clang 依赖链源头）----
          sed -i 's/^CONFIG_PACKAGE_naiveproxy=y/# CONFIG_PACKAGE_naiveproxy is not set/' .config
          sed -i 's/^CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_NaiveProxy=y/# CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_NaiveProxy is not set/' .config

          # ---- 保险丝 2：libustream 三选一，只留 mbedtls ----
          sed -i 's/^CONFIG_PACKAGE_libustream-openssl=y/# CONFIG_PACKAGE_libustream-openssl is not set/' .config
          sed -i 's/^CONFIG_PACKAGE_libustream-wolfssl=y/# CONFIG_PACKAGE_libustream-wolfssl is not set/' .config
          grep -q '^CONFIG_PACKAGE_libustream-mbedtls=y' .config || \
            echo 'CONFIG_PACKAGE_libustream-mbedtls=y' >> .config

          make defconfig

          # ---- 保险丝 3：所有 =n 必须写成 "is not set"，否则 defconfig 后不生效 ----
          sed -i 's/^\(CONFIG_[A-Za-z0-9_]*\)=n$/# \1 is not set/' .config

          # ---- 构建前断言：关键项不符合预期就直接失败，不浪费 1 小时 ----
          echo "===== 关键配置自检 ====="
          FAIL=0
          chk() { # chk <模式> <应出现|不应出现> <说明>
            if grep -q "$1" .config; then
              [ "$2" = "应出现" ] && echo "  OK   $3" || { echo "  FAIL $3（本应关闭却为 y）"; FAIL=1; }
            else
              [ "$2" = "不应出现" ] && echo "  OK   $3（已关闭）" || { echo "  FAIL $3（缺失！）"; FAIL=1; }
            fi
          }
          chk '^CONFIG_TARGET_x86_64=y'            应出现   "目标平台 x86_64"
          chk '^CONFIG_PACKAGE_luci-app-ssr-plus=y' 应出现   "SSR-Plus 主包"
          chk '^CONFIG_PACKAGE_luci-app-ssr-plus_INCLUDE_Xray=y' 应出现 "Xray 内核"
          chk 'naiveproxy'                          不应出现 "NaiveProxy（gn/clang 依赖源头）"
          chk '^CONFIG_PACKAGE_libustream-mbedtls=y' 应出现  "libustream 后端 mbedtls"
          chk '^CONFIG_PACKAGE_libustream-openssl=y' 不应出现 "libustream-openssl（重复符号）"
          chk '^CONFIG_PACKAGE_libustream-wolfssl=y' 不应出现 "libustream-wolfssl（重复符号）"
          echo "----- libustream / naiveproxy 实际状态 -----"
          grep -E '^#?CONFIG_PACKAGE_(libustream|naiveproxy)' .config || true
          [ "$FAIL" = "0" ] || { echo ">> 配置自检未通过，终止编译"; exit 1; }
          echo ">> 配置自检通过"

          # ---- 环境版本快照：事后排错不用重跑一遍 ----
          echo "===== 工具链版本 ====="
          clang++ --version 2>/dev/null | head -2 || echo "clang++ 缺失"
          go version 2>/dev/null || echo "golang 尚未就位（feeds 阶段后才有）"
          gcc --version | head -1
          python3 --version
          echo "===== SSR-Plus 启用的组件 ====="
          grep -c 'ssr-plus_INCLUDE.*=y' .config

          echo "===================== 自检 ====================="
          echo "--- NaiveProxy 相关（应为空）---"
          grep -E '^CONFIG_PACKAGE_(naiveproxy|luci-app-ssr-plus_INCLUDE_NaiveProxy)=y' .config && {
            echo "FATAL: NaiveProxy 仍未关闭"; exit 1; } || echo "OK: NaiveProxy 已关闭"

          echo "--- gn（应为空，gn 只为 naiveproxy 服务）---"
          grep -E '^CONFIG_PACKAGE_gn' .config || echo "OK: gn 未进入编译队列"

          echo "--- libustream（应只有 mbedtls）---"
          grep '^CONFIG_PACKAGE_libustream' .config

          echo "--- SSR-Plus 已启用组件 ---"
          grep '^CONFIG_PACKAGE_luci-app-ssr-plus' .config

      # -------------------------------------------------------
      - name: Download packages
        run: |
          make download -j16
          echo "--- dl 目录占用 ---"
          du -sh dl 2>/dev/null || true

      # -------------------------------------------------------
      # -------------------------------------------------------
      # xray-core / mihomo / hysteria / tuic 均为 Go 项目且要求 Go >= 1.22。
      # 若你的 lede 分支自带旧 Go，xray 会在编译中段炸掉，这里提前拦住。
      - name: Check Golang toolchain version
        run: |
          set -e
          GO_BIN="$(command -v go || true)"
          if [ -z "$GO_BIN" ]; then
            echo ">> 尚未检测到 go（可能由 feeds 阶段准备），跳过预检"
            exit 0
          fi
          V="$($GO_BIN version | awk '{print $3}')"
          echo "当前 Go 版本: $V"
          MAJ="$($GO_BIN version | awk '{print $3}' | sed -E 's/^go([0-9]+)\..*/\1/')"
          MIN="$($GO_BIN version | awk '{print $3}' | sed -E 's/^go[0-9]+\.([0-9]+).*/\1/')"
          echo ">> MAJ=$MAJ MIN=$MIN"
          if [ "${MAJ:-0}" -gt 1 ] || { [ "${MAJ:-0}" -eq 1 ] && [ "${MIN:-0}" -ge 22 ]; }; then
            echo ">> Go 版本满足 xray-core 要求 (>=1.22)"
          else
            echo "::warning::Go $V 低于 1.22，xray-core / mihomo 大概率编译失败。"
            echo "::warning::请在 .config 提升 CONFIG_GOLANG_VERSION，或暂时关闭 Xray。"
            echo "----- 参考：当前 .config 中的 golang 设置 -----"
            grep -iE 'GOLANG|GO_VERSION' .config || echo "（.config 未显式声明 golang 版本，使用源码树默认值）"
          fi

      - name: Compile firmware
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          ccache -M 5G || true
          ccache -s || true

          make -j$(nproc) || make -j1 V=s

          echo "======================="
          echo "Space usage:"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1 ./ --exclude=build_dir --exclude=bin
          du -h --max-depth=1 ./build_dir
          du -h --max-depth=1 ./bin
          echo "======================="
          ccache -s || true

      # -------------------------------------------------------
      - name: Prepare artifact
        run: |
          set -e
          mkdir -p ./artifact/package
          mkdir -p ./artifact/buildinfo
          mkdir -p ./artifact/firmware

          # 固件镜像（x86_64: img.gz / vdi / vmdk / iso 等）
          find ./bin/targets/ -type f \
            \( -name "*.img.gz" -o -name "*.img" -o -name "*.vmdk" \
               -o -name "*.vdi" -o -name "*.vhdx" -o -name "*.iso" \
               -o -name "*-combined-*.tar.gz" -o -name "*manifest*" \) \
            -exec cp -v {} ./artifact/firmware/ \;

          # ipk 软件包 + 构建清单
          # 注意：先收集再删除；rm 的 $(find ...) 若为空会变成 `rm -rf` 裸调用，必须判空
          PKGDIRS="$(find ./bin/targets/ -type d -name packages 2>/dev/null || true)"
          if [ -n "$PKGDIRS" ]; then
            echo ">> 清理 targets 下 packages 目录（不并入固件包）"
            rm -rf $PKGDIRS
          fi
          cp -rf $(find ./bin/packages/ -type f -name "*.ipk" 2>/dev/null) ./artifact/package/ 2>/dev/null || echo "（无 ipk）"
          find ./bin/targets/ -type f \( -name "*.buildinfo" -o -name "*.manifest" \) \
            -exec cp -v {} ./artifact/buildinfo/ \; 2>/dev/null || echo "（无 buildinfo）"

          echo "===== artifact 内容 ====="
          ls -lhR ./artifact | head -100

      # -------------------------------------------------------
      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware
          path: ./artifact/firmware/
          if-no-files-found: warn

      - name: Upload package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_package
          path: ./artifact/package/
          if-no-files-found: warn

      - name: Upload buildinfo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_buildinfo
          path: ./artifact/buildinfo/
          if-no-files-found: warn

      # -------------------------------------------------------
      # 失败时把关键日志直接打到 CI 页面，省掉一次 V=s 重跑
      - name: Dump failure context
        if: failure()
        run: |
          echo "########## 最近 400 行日志 ##########"
          find logs -type f -name "*.txt" 2>/dev/null | tail -5 | while read f; do
            echo "=========== $f ==========="
            tail -n 150 "$f"
          done
          echo "########## clang 状态 ##########"
          which clang clang++ || echo "clang 缺失！"
          clang++ --version 2>/dev/null || true
          echo "########## gn 相关 ##########"
          ls -l build_dir/hostpkg/ 2>/dev/null | grep -i gn || echo "无 gn 构建目录"
          echo "########## 磁盘 ##########"
          df -h

      # -------------------------------------------------------
      # 可选：手动触发且勾选 release 时自动发布
      # 需把顶部 permissions 改为 contents: write
      - name: Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: OpenWrt-x86_64-${{ github.run_number }}
          name: OpenWrt x86_64 固件 ${{ github.run_number }}
          body: |
            自动编译产物
            - 源码: ${{ github.repository }} @ ${{ github.sha }}
            - 触发方式: ${{ github.event_name }} (by ${{ github.actor }})
            - 运行编号: ${{ github.run_id }}
            - 变更: SSR-Plus 全家桶（已关闭 NaiveProxy / gn，改用 clang-15）
          files: ./artifact/firmware/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
