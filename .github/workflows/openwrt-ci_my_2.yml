name: OpenWrt-CI_My

on:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * 5'   # 每周五 20:30 UTC
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_openwrt:
    name: Build OpenWrt Firmware
    runs-on: ubuntu-22.04
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Initialize environment
        run: |
          sudo -E apt-get update -y
          sudo -E apt-get -y install \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler flex gawk gcc-multilib g++-multilib \
            gettext genisoimage git gperf haveged help2man intltool \
            libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libpython3-dev \
            libreadline-dev libssl-dev libtool llvm lrzsz msmtp \
            ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pyelftools python3-setuptools qemu-utils rsync \
            scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E timedatectl set-timezone "$TZ"
          # 清理不需要的包，进一步释放空间
          sudo -E apt-get -y purge azure-cli* docker* ghc* zulu* llvm* \
            firefox google* powershell* openjdk* mysql* php* mongodb* || true
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean

      - name: Cache OpenWrt toolchain & download
        uses: actions/cache@v4
        with:
          path: |
            ./dl
            ./staging_dir
            ./build_dir/host
            ./build_dir/toolchain-*
          key: openwrt-${{ runner.os }}-${{ hashFiles('feeds.conf.default', 'makeconfig.d/x86_64.config') }}
          restore-keys: |
            openwrt-${{ runner.os }}-

      - name: Update feeds
        run: |
          # 删除已有 helloworld，避免重复
          sed -i '/helloworld/d' feeds.conf.default
          echo "src-git helloworld https://github.com/fw876/helloworld.git" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate configuration
        run: |
          cp ./makeconfig.d/x86_64.config .config
          make defconfig
          # 可选：输出最终配置，方便排查
          # ./scripts/diffconfig.sh > diffconfig.txt

      - name: Download packages
        run: make download -j$(nproc)

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 V=s
          echo "======================="
          echo "Space usage after build:"
          df -h
          echo "======================="
          du -h --max-depth=1 ./ --exclude=build_dir --exclude=bin || true
          du -h --max-depth=1 ./build_dir || true
          du -h --max-depth=1 ./bin || true

      - name: Prepare artifacts
        run: |
          mkdir -p artifact/{package,buildinfo,firmware}
          # 清理 targets 下的 packages 目录（体积大且通常不需要）
          find bin/targets -type d -name packages -exec rm -rf {} + 2>/dev/null || true
          # 复制 ipk
          find bin/packages -type f -name "*.ipk" -exec cp {} artifact/package/ \; 2>/dev/null || true
          # 复制 buildinfo
          find bin/targets -type f \( -name "*.buildinfo" -o -name "*.manifest" \) \
            -exec cp {} artifact/buildinfo/ \; 2>/dev/null || true
          # 复制固件（按你的实际目标调整）
          find bin/targets -type f \( -name "*.bin" -o -name "*.img*" -o -name "*.tar.gz" -o -name "*.vdi" -o -name "*.vmdk" \) \
            -exec cp {} artifact/firmware/ \; 2>/dev/null || true
          ls -lh artifact/firmware/ || true

      - name: Upload buildinfo
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_buildinfo-${{ github.run_number }}
          path: artifact/buildinfo/
          retention-days: 30

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_package-${{ github.run_number }}
          path: artifact/package/
          retention-days: 15

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware-${{ github.run_number }}
          path: artifact/firmware/
          retention-days: 30